<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Timeless Story 💫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #000000 0%, #1a0000 100%);
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
        }

        /* تأثيرات الخلفية */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 0, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 0, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 0, 0, 0.05) 0%, transparent 50%);
            animation: pulse 4s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .container {
            text-align: center;
            z-index: 2;
            max-width: 800px;
            width: 100%;
            padding: 10px;
            position: relative;
        }

        .title {
            font-size: 24px;
            margin-bottom: 30px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            padding: 0 10px;
            line-height: 1.3;
        }

        .counter-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .time-unit {
            background: rgba(20, 0, 0, 0.8);
            padding: 20px 10px;
            border-radius: 12px;
            border: 2px solid rgba(255, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90px;
        }

        .time-number {
            font-size: 32px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
            margin-bottom: 5px;
            font-family: 'Courier New', monospace;
            line-height: 1;
        }

        .time-label {
            font-size: 12px;
            color: #cccccc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .message {
            font-size: 18px;
            line-height: 1.5;
            color: #ffffff;
            margin-bottom: 35px;
            padding: 0 15px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .heart {
            color: #ff0000;
            font-size: 20px;
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn {
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            min-width: 140px;
            flex: 1;
            max-width: 200px;
            touch-action: manipulation;
        }

        .btn:hover, .btn:active {
            background: linear-gradient(135deg, #ff3333, #ff0000);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        .btn-back {
            background: linear-gradient(135deg, #666666, #444444);
        }

        .btn-back:hover, .btn-back:active {
            background: linear-gradient(135deg, #888888, #666666);
        }

        /* تأثيرات الجسيمات */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(255, 0, 0, 0.3);
            border-radius: 50%;
            animation: float-particle 6s infinite linear;
        }

        @keyframes float-particle {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100px) rotate(360deg); }
        }

        /* تحسينات للشاشات الصغيرة جداً */
        @media (max-width: 400px) {
            .title {
                font-size: 22px;
                margin-bottom: 25px;
            }
            
            .counter-container {
                gap: 10px;
            }
            
            .time-unit {
                padding: 15px 8px;
                min-height: 80px;
            }
            
            .time-number {
                font-size: 28px;
            }
            
            .time-label {
                font-size: 11px;
            }
            
            .message {
                font-size: 16px;
                margin-bottom: 30px;
            }
            
            .btn {
                padding: 12px 20px;
                font-size: 15px;
                min-width: 130px;
            }
        }

        /* تحسينات للهواتف في الوضع الأفقي */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                padding: 10px;
                justify-content: flex-start;
                min-height: auto;
            }
            
            .container {
                padding-top: 20px;
            }
            
            .title {
                margin-bottom: 20px;
                font-size: 22px;
            }
            
            .counter-container {
                margin-bottom: 25px;
                max-width: 600px;
            }
            
            .time-unit {
                padding: 15px 8px;
                min-height: 80px;
            }
            
            .message {
                margin-bottom: 25px;
                font-size: 16px;
            }
            
            .buttons-container {
                margin-bottom: 20px;
            }
        }

        /* دعم للأجهزة القديمة */
        @media (max-width: 320px) {
            .counter-container {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .title {
                font-size: 20px;
            }
            
            .message {
                font-size: 15px;
            }
            
            .buttons-container {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                max-width: 100%;
            }
        }

        /* تحسينات للشاشات الكبيرة */
        @media (min-width: 769px) {
            .container {
                padding: 20px;
            }
            
            .title {
                font-size: 28px;
            }
            
            .counter-container {
                gap: 20px;
                max-width: 600px;
            }
            
            .time-unit {
                padding: 25px 15px;
                min-height: 110px;
            }
            
            .time-number {
                font-size: 40px;
            }
            
            .message {
                font-size: 20px;
                max-width: 600px;
            }
        }

        /* منع التكبير على الهواتف */
        input, textarea, select {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- تأثير الجسيمات -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <h1 class="title">Our Journey Together <span class="heart">❤️</span></h1>
        
        <div class="counter-container">
            <div class="time-unit">
                <div class="time-number" id="days">000</div>
                <div class="time-label">DAYS</div>
            </div>
            <div class="time-unit">
                <div class="time-number" id="hours">00</div>
                <div class="time-label">HOURS</div>
            </div>
            <div class="time-unit">
                <div class="time-number" id="minutes">00</div>
                <div class="time-label">MINUTES</div>
            </div>
            <div class="time-unit">
                <div class="time-number" id="seconds">00</div>
                <div class="time-label">SECONDS</div>
            </div>
        </div>

        <div class="message">
            ✨ Our time together isn't just memories — it's the story I'll keep forever
        </div>

        <div class="buttons-container">
            <a href="main.html" class="btn btn-back">⬅️ Back</a>
            <a href="gallery.html" class="btn">Next Page 💌</a>
        </div>
    </div>

    <script>
        // تاريخ البداية - 1 مارس 2025
        const startDate = new Date('2025-03-01T00:00:00').getTime();

        function updateCounter() {
            const now = new Date().getTime();
            const distance = now - startDate;
            
            // الحسابات
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            // تحديث الأرقام مع إضافة صفر للأرقام أقل من 10
            document.getElementById('days').textContent = days.toString().padStart(3, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }

        // إنشاء الجسيمات
        function createParticles() {
            const particles = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 10 : 15;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 8 + 4;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particles.appendChild(particle);
            }
        }

        // إعادة حساب الجسيمات عند تغيير حجم الشاشة
        function handleResize() {
            const particles = document.getElementById('particles');
            particles.innerHTML = '';
            createParticles();
        }

        // بدء التشغيل
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            updateCounter();
            // تحديث العد كل ثانية
            setInterval(updateCounter, 1000);
            
            // إضافة مستمع لتغيير حجم الشاشة
            window.addEventListener('resize', handleResize);
        });

        // تحسين الأداء على الهواتف
        document.addEventListener('touchstart', function() {}, {passive: true});
    </script>
</body>
    </html>
